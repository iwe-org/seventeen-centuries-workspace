$schema: https://document-schema.org/draft/2026-06/schema
description: >-
  One idea, person, school or theme (concepts/<slug>.md). A single "# Title"
  holds "## Summary", how each author uses it, and "## Mentioned In", the
  passages that treat it, grouped by book under "### Meditations",
  "### The Prince" and "### Beyond Good and Evil". works lists the books whose
  passages the document links and is updated whenever that changes.
maxDepth: 3
frontmatter:
  type: object
  required: [type, works]
  additionalProperties: false
  properties:
    type: { const: concept }
    works:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        enum: [meditations, prince, bge]
      description: >-
        works lists the books whose passages this concept links under
        Mentioned In, in the order meditations, prince, bge
sections:
  - maxContains: 1
    description: a concept is one "# Title" heading holding Summary, optional Articles, then Mentioned In
    sections:
      - header: { const: Summary }
        maxContains: 1
        description: a comparison of how each author uses the concept, grounded in the linked passages
      - header: { const: Articles }
        minContains: 0
        maxContains: 1
        description: the articles written mainly about this concept
      - header: { const: Mentioned In }
        maxContains: 1
        description: the passages that treat the concept, one "### <Book>" group per book
        sections:
          - header: { enum: [Meditations, The Prince, Beyond Good and Evil] }
            maxContains: 3
            description: 'groups are "### Meditations", "### The Prince" and "### Beyond Good and Evil"'
        additionalSections: false
    additionalSections: false
additionalSections: false
