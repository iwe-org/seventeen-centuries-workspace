version = 4

[markdown]
refs_extension = ".md"
date_format = "%b %d, %Y"

[workspace]
path = "graph"
date_format = "%Y-%m-%d"

[search]
language = "english"

[completion]

[templates.default]
key_template = "{{slug}}"
document_template = """
# {{title}}

{{content}}"""

[actions.extract_all]
type = "extract_all"
title = "Extract all subsections"
link_type = "markdown"
key_template = "{{id}}"

[actions.extract]
type = "extract"
title = "Extract"
link_type = "markdown"
key_template = "{{id}}"

[actions.link]
type = "link"
title = "Link"
link_type = "markdown"
key_template = "{{id}}"

[actions.inline_section]
type = "inline"
title = "Inline section"
inline_type = "section"
keep_target = false

[actions.inline_quote]
type = "inline"
title = "Inline quote"
inline_type = "quote"
keep_target = false

[actions.sort]
type = "sort"
title = "Sort A-Z"
reverse = false

[actions.sort_desc]
type = "sort"
title = "Sort Z-A"
reverse = true

[actions.today]
type = "attach"
title = "Add Date"
key_template = "{{today}}"
document_template = """
# {{today}}

{{content}}
"""
